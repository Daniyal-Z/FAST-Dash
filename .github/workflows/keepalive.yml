name: Keep Supabase awake

# Supabase pauses free projects after 7 consecutive days with no API traffic.
# Term breaks can easily be that quiet, and a paused project means the site
# shows nothing until someone restores it from the dashboard. One cheap read a
# day prevents that.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_URL       https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  the publishable / anon key
#
# Note these are NOT the same entries as the Vercel environment variables:
# different names, different place, no VITE_ prefix.
#
# This replaces the old "Health Ping - Keep service alive" hack that existed to
# fight Render's 15-minute spin-down.

on:
  schedule:
    - cron: '17 6 * * *' # 06:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write # only for the heartbeat commit in the last step

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # v4 runs on Node 20, which the runners now warn about. Every major from
      # v5 up runs Node 24; v7 is current and its breaking changes concern
      # pull-request checkout, which does not apply to a scheduled run.
      - uses: actions/checkout@v7
        with:
          # The heartbeat step below pushes a commit, so the token has to
          # survive the checkout. This is the default today; stating it means a
          # future change of default cannot break the step silently.
          persist-credentials: true

      - name: Read one row from the datasets table
        env:
          # Accept either a Secret or a Variable. They are configured on the
          # same settings page under two different tabs, and putting them in
          # the wrong one is an easy mistake with a confusing failure. The
          # anon key is public by design, so a Variable is a fine place for it.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          HAS_URL_SECRET: ${{ secrets.SUPABASE_URL != '' }}
          HAS_URL_VAR: ${{ vars.SUPABASE_URL != '' }}
          HAS_KEY_SECRET: ${{ secrets.SUPABASE_ANON_KEY != '' }}
          HAS_KEY_VAR: ${{ vars.SUPABASE_ANON_KEY != '' }}
        run: |
          set -euo pipefail

          # Report where each value came from. Lengths are safe to print and
          # catch the other classic mistake: a trailing space or newline.
          echo "SUPABASE_URL      secret=${HAS_URL_SECRET} variable=${HAS_URL_VAR} length=${#SUPABASE_URL}"
          echo "SUPABASE_ANON_KEY secret=${HAS_KEY_SECRET} variable=${HAS_KEY_VAR} length=${#SUPABASE_ANON_KEY}"

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::Could not read SUPABASE_URL / SUPABASE_ANON_KEY."
            echo "Set them at Settings -> Secrets and variables -> Actions."
            echo "Use the 'Secrets' or 'Variables' tab (either works), and the"
            echo "'Repository' section — not Environment, Dependabot or Codespaces."
            echo "Names are exact and case-sensitive, with no VITE_ prefix."
            exit 1
          fi

          # A trailing newline pasted into the box breaks the URL silently.
          SUPABASE_URL="${SUPABASE_URL%/}"

          status=$(curl -sS -o /tmp/body -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/datasets?select=kind,updated_at" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP ${status}"
          cat /tmp/body

          if [ "$status" != "200" ]; then
            echo "::error::Unexpected status ${status} — the project may be paused."
            exit 1
          fi

      # GitHub disables scheduled workflows after 60 days without a commit, and
      # only commits reset that clock — not issues, tags or workflow runs. Left
      # alone, a quiet term break would switch off the very job that keeps the
      # database awake. So if the repository has gone quiet, make a commit.
      #
      # The 40-day threshold leaves 20 days of margin, and means an actively
      # developed repository never sees one of these commits at all.
      - name: Keep this workflow from being auto-disabled
        run: |
          set -euo pipefail

          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          days=$(( (now - last) / 86400 ))
          echo "Last commit was ${days} day(s) ago."

          if [ "$days" -lt 40 ]; then
            echo "Repository is active — no heartbeat needed."
            exit 0
          fi

          date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive-heartbeat
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive-heartbeat
          git commit -m "chore: keepalive heartbeat [skip ci]"
          git push
          echo "Pushed a heartbeat commit to reset GitHub's 60-day timer."
